<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Flatmate</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f7fb;
            color: #172033;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            margin-top: 30px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.06);
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            margin-top: 8px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            padding: 13px 18px;
            border: none;
            border-radius: 10px;
            background: #172033;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .back {
            display: inline-block;
            margin-top: 15px;
            color: #172033;
            text-decoration: none;
        }

        .error {
            background: #ffe8e8;
            color: #c62828;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #687386;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>👤 Add Flatmate</h1>

    <p class="subtitle">
        Add the people who share expenses with you.
    </p>

    {% if messages %}
        {% for message in messages %}
            <div class="error">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <label for="name">
            <strong>Flatmate Name</strong>
        </label>

        <input
            type="text"
            id="name"
            name="name"
            placeholder="e.g. Pratham"
            required
        >

        <button type="submit">
            Add Flatmate 👤
        </button>

    </form>

    <a class="back" href="{% url 'home' %}">
        ← Back to Home
    </a>

</div>

</body>
</html>
