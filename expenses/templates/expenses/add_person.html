<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Flatmate</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f7fb;
            color: #172033;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            margin-top: 30px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            margin-top: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            padding: 13px 18px;
            border: none;
            border-radius: 10px;
            background: #172033;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .back {
            display: inline-block;
            margin-top: 15px;
            color: #172033;
            text-decoration: none;
        }

        .message {
            background: #e7f7ec;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

    </style>

</head>

<body>

    <h1>👤 Add Flatmate</h1>

    <div class="card">

        {% if messages %}

            {% for message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <label for="name">
                Flatmate Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter flatmate name"
                required
            >

            <button type="submit">
                Add Flatmate
            </button>

        </form>

        <a
            class="back"
            href="{% url 'home' %}"
        >
            ← Back to Home
        </a>

    </div>

</body>

</html>
